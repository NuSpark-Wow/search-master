<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Search Master | Learn...Wow!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --em1:#0F6E51; --em2:#073D2E; --em3:#0A5640;
  --gold:#F2B33D; --gold2:#E09E1F;
  --cream:#F7F3E8; --soft:rgba(247,243,232,.78);
  --line:rgba(242,179,61,.35); --panel:rgba(255,255,255,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:'Inter',system-ui,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased}
.card{background:linear-gradient(180deg,var(--em1) 0%,var(--em2) 100%);border-radius:28px;padding:34px 30px 30px;position:relative;overflow:hidden}
.label{text-align:center;color:var(--gold);font-weight:700;letter-spacing:.28em;font-size:13px;text-transform:uppercase;margin-bottom:12px}
h1{font-family:'Lora',Georgia,serif;font-weight:700;text-align:center;font-size:clamp(26px,3.4vw,38px);line-height:1.18;margin-bottom:10px}
.sub{text-align:center;color:var(--soft);font-size:17px;line-height:1.5;max-width:520px;margin:0 auto 18px}

/* Banner */
.banner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:2px 0 10px}
.pane{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:8px 10px;display:flex;align-items:center;gap:8px;text-align:left}
.pane svg{width:76px;height:auto;display:block;flex-shrink:0}
.cap{font-weight:600;font-size:13px;line-height:1.3;white-space:nowrap}
@media(max-width:560px){.cap{white-space:normal}}
.pane.before .cap{color:#F6B4A6}
.pane.after .cap{color:var(--gold)}
.tag{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;opacity:.7;margin-bottom:4px}

/* Platform grid */
.ask{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(0,0,0,.22);border:1.5px solid rgba(242,179,61,.45);color:var(--cream);border-radius:999px;padding:13px 22px;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;transition:.15s}
.ask:hover{border-color:var(--gold)}
.ask .chev{color:var(--gold);font-size:14px;transition:transform .2s}
.ask.open .chev{transform:rotate(180deg)}
.picker{display:none;margin-top:12px;animation:pop .25s ease}
.picker.open{display:block}
.home h1{font-size:clamp(22px,2.5vw,30px);margin-bottom:6px}
.home .sub{font-size:16px;margin-bottom:10px}
.card.home{padding:24px 22px 22px;display:flex;flex-direction:column;justify-content:center}
.home .grid .pbtn{padding:10px 4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pbtn{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.14);color:var(--cream);border-radius:16px;padding:12px 6px;cursor:pointer;font-family:inherit;transition:.15s}
.pbtn:hover{border-color:var(--gold);background:rgba(242,179,61,.12)}
.pbtn .ic{font-size:22px;display:block;margin-bottom:4px}
.pbtn .nm{font-weight:700;font-size:14px;display:block}
.pbtn .ps{font-size:11px;opacity:.7;display:block;margin-top:2px}
.try{text-align:center;margin-top:14px;font-size:14px;line-height:1.9;color:var(--soft)}
.try a{color:var(--gold);text-decoration:underline;text-underline-offset:4px;cursor:pointer}

/* Module */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.mtitle{font-family:'Lora',Georgia,serif;font-weight:700;font-size:22px}
.mtitle small{display:block;font-family:'Inter';font-weight:600;font-size:12px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:2px}
.ctrls{display:flex;gap:8px;flex-shrink:0}
.cbtn{background:transparent;border:1.5px solid var(--gold);color:var(--gold);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.cbtn:hover{background:var(--gold);color:var(--em2)}
.tip{display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.18);border-left:4px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:15px;line-height:1.45}
.tip svg{width:52px;height:52px;flex-shrink:0}
.exbtn{background:none;border:none;color:var(--gold);text-decoration:underline;text-underline-offset:4px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;margin:0 0 14px}

.step{background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 16px;margin-bottom:12px;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sh{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.n{background:var(--gold);color:var(--em2);width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.ex{font-size:13px;color:var(--soft);margin:6px 0 8px 36px}
.ex b{color:var(--cream);font-weight:600}
.field{margin-left:36px}
input[type=text]{width:100%;background:rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.18);border-radius:12px;color:var(--cream);font-size:16px;padding:11px 14px;font-family:inherit;outline:none}
input[type=text]:focus{border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(0,0,0,.2);border:1.5px solid rgba(255,255,255,.2);color:var(--cream);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--em2)}
.sa{display:flex;gap:10px;margin:12px 0 0 36px}
.go{background:var(--gold);color:var(--em2);border:none;border-radius:999px;padding:10px 20px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
.go:hover{background:var(--gold2)}
.ghost{background:transparent;color:var(--cream);border:1.5px solid rgba(255,255,255,.3);border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
.warn{color:#F6B4A6;font-size:13px;margin:8px 0 0 36px;display:none}

.live{border:1.5px dashed var(--line);border-radius:14px;padding:10px 14px;margin:4px 0 14px;font-size:14px}
.live span{color:var(--soft);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;display:block;margin-bottom:4px}
code,.q{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.live code{color:var(--gold);word-break:break-word}

.noanim,.noanim *{animation:none!important}
.result{border-top:1px solid rgba(255,255,255,.12);padding-top:18px;margin-top:6px;animation:pop .3s ease}
.rh{font-family:'Lora',Georgia,serif;font-size:22px;font-weight:700;margin-bottom:10px}
.qbox{background:rgba(0,0,0,.3);border:2px solid var(--gold);border-radius:14px;padding:14px;font-size:16px;color:#fff;word-break:break-word;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 18px}
.parts{list-style:none;margin-bottom:18px}
.parts li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px;line-height:1.45}
.parts code{background:rgba(242,179,61,.15);color:var(--gold);padding:3px 8px;border-radius:8px;max-width:50%;word-break:break-word;flex-shrink:0}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.bacol{background:var(--panel);border-radius:14px;padding:12px;border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column}
.bacol h4{font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.bacol.b h4{color:#F6B4A6}.bacol.a h4{color:var(--gold)}
.bacol code{font-size:13px;word-break:break-word;flex:1;margin-bottom:10px;line-height:1.45}
.mini{background:transparent;border:1.5px solid currentColor;border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;align-self:flex-start}
.bacol.b .mini{color:#F6B4A6}.bacol.a .mini{color:var(--gold)}
.extra{background:rgba(0,0,0,.18);border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:14px;line-height:1.5}
.extra code{color:var(--gold);word-break:break-word;display:block;margin:6px 0 10px}
.changes{text-align:center;background:rgba(242,179,61,.1);border:1.5px solid var(--line);border-radius:16px;padding:16px}
.changes p{font-weight:700;font-size:18px;margin-bottom:12px}
.changes .row{justify-content:center;margin:0}
.how{background:rgba(0,0,0,.2);border-radius:16px;padding:16px 18px;margin-top:14px;animation:pop .3s ease}
.how h4{font-family:'Lora',Georgia,serif;font-size:19px;margin-bottom:10px}
.how ol{margin-left:20px;line-height:1.6;font-size:15px}
.how li{margin-bottom:6px}
.note{font-size:13px;color:var(--soft);margin-top:10px;line-height:1.5}
.plat{text-align:center;font-size:12px;color:var(--soft);margin:0 0 10px;line-height:1.5}
.plat b{color:var(--gold);font-weight:700}
.hint{font-size:12.5px;color:var(--soft);margin-top:6px;line-height:1.45}
.hint b{color:var(--cream)}
.wchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:12px;color:var(--soft)}
.wchips i{font-style:normal;background:rgba(242,179,61,.15);color:var(--gold);border-radius:999px;padding:3px 10px;font-weight:600}
.sugl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-bottom:8px}
.aistep{border-color:rgba(242,179,61,.45);background:rgba(242,179,61,.07)}
.thinking .n{animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.4}to{opacity:1}}
.better{margin:0 0 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.better .note{margin:0}
.impcard{width:100%;background:rgba(242,179,61,.08);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.impcard h4{font-family:'Lora',Georgia,serif;font-size:17px;margin-bottom:6px}
.impcard code{display:block;color:#fff;word-break:break-word;margin-bottom:8px;font-size:14px}
.impcard ul{margin-left:18px;font-size:14px;line-height:1.5}
.nudge{background:rgba(242,179,61,.08);border:1.5px dashed var(--line);border-radius:14px;padding:14px;margin-bottom:18px;font-size:14px;line-height:1.5}
.tipline{background:rgba(242,179,61,.1);border-radius:12px;padding:10px 12px;font-size:14px;margin:-6px 0 16px;line-height:1.45}
.warnline{margin:-8px 0 14px;color:var(--gold)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--gold);color:var(--em2);font-weight:700;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){
  .card{padding:26px 16px 22px;border-radius:22px}
  .ba{grid-template-columns:1fr}
  .topbar{flex-direction:column;align-items:flex-start}
  .ex,.field,.sa,.warn{margin-left:0}
  .sa{flex-wrap:wrap}
  .parts code{max-width:55%}
}
</style>
</head>
<body>
<div class="card" id="app"></div>
<div class="toast" id="toast">Copied!</div>

<script>
/* ---------- Cartoon Mr. Paul ---------- */
function mrPaul(mood){
  const skin='#F5CBAA', robe='#1E1F24';
  const sad = mood==='sad';
  const brows = sad
    ? '<path d="M68 70 L91 76" stroke="#8a8a8a" stroke-width="4" stroke-linecap="round"/><path d="M132 70 L109 76" stroke="#8a8a8a" stroke-width="4" stroke-linecap="round"/>'
    : '<path d="M69 72 Q80 65 91 71" stroke="#8a8a8a" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M109 71 Q120 65 131 72" stroke="#8a8a8a" stroke-width="4" fill="none" stroke-linecap="round"/>';
  const mouth = sad
    ? '<path d="M86 123 Q100 113 114 123" stroke="#9b4a2c" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
    : '<path d="M83 113 Q100 130 117 113" stroke="#9b4a2c" stroke-width="3.5" fill="#fff" stroke-linecap="round"/>';
  const extras = sad
    ? `<path d="M48 200 Q26 150 46 84" stroke="${robe}" stroke-width="17" fill="none" stroke-linecap="round"/>
       <circle cx="49" cy="76" r="11" fill="${skin}" stroke="#d9a07e" stroke-width="1.5"/>
       <path d="M150 54 q7 11 0 16 q-7 -5 0 -16z" fill="#8fd3ff"/>
       <text x="160" y="44" font-family="Lora,Georgia,serif" font-weight="700" font-size="30" fill="#F6B4A6">?</text>
       <text x="176" y="66" font-family="Lora,Georgia,serif" font-weight="700" font-size="22" fill="#F6B4A6">?</text>`
    : `<path d="M152 200 Q174 168 170 138" stroke="${robe}" stroke-width="17" fill="none" stroke-linecap="round"/>
       <rect x="158" y="120" width="24" height="20" rx="7" fill="${skin}" stroke="#d9a07e" stroke-width="1.5"/>
       <rect x="162" y="100" width="10" height="24" rx="5" fill="${skin}" stroke="#d9a07e" stroke-width="1.5"/>
       <path d="M30 46 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#F2B33D"/>
       <path d="M44 22 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#F2B33D"/>
       <path d="M176 70 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#F2B33D"/>`;
  return `<svg viewBox="0 0 200 210" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M38 210 Q42 158 100 150 Q158 158 162 210Z" fill="${robe}"/>
    <path d="M84 150 L100 180 L116 150Z" fill="#A9CCEF"/>
    <path d="M97 158 L103 158 L102.5 176 L100 181 L97.5 176Z" fill="${robe}"/>
    <rect x="88" y="126" width="24" height="28" fill="${skin}"/>
    <ellipse cx="57" cy="92" rx="9" ry="13" fill="${skin}"/>
    <ellipse cx="143" cy="92" rx="9" ry="13" fill="${skin}"/>
    <path d="M54 66 Q42 96 58 120 Q63 98 62 76Z" fill="#ECECEE" stroke="#c9c9cc" stroke-width="1.5"/>
    <path d="M146 66 Q158 96 142 120 Q137 98 138 76Z" fill="#ECECEE" stroke="#c9c9cc" stroke-width="1.5"/>
    <ellipse cx="100" cy="86" rx="44" ry="50" fill="${skin}"/>
    <path d="M57 72 Q58 34 100 33 Q142 34 143 72 Q130 52 100 50 Q70 52 57 72Z" fill="#E6E6E8" stroke="#cfcfd2" stroke-width="1.5"/>
    <path d="M78 44 Q90 40 98 48 M104 44 Q114 40 124 47" stroke="#cfcfd2" stroke-width="2" fill="none"/>
    ${brows}
    <rect x="67" y="79" width="27" height="19" rx="5" fill="rgba(255,255,255,.35)" stroke="#3a3a3e" stroke-width="4"/>
    <rect x="106" y="79" width="27" height="19" rx="5" fill="rgba(255,255,255,.35)" stroke="#3a3a3e" stroke-width="4"/>
    <path d="M94 87 L106 87" stroke="#3a3a3e" stroke-width="4"/>
    <circle cx="80.5" cy="89" r="3.2" fill="#2b2b2b"/><circle cx="119.5" cy="89" r="3.2" fill="#2b2b2b"/>
    <path d="M100 94 Q95 106 102 107" stroke="#c98f6d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="72" cy="110" rx="7" ry="4.5" fill="#F2A0A0" opacity=".65"/>
    <ellipse cx="128" cy="110" rx="7" ry="4.5" fill="#F2A0A0" opacity=".65"/>
    ${mouth}
    ${extras}
  </svg>`;
}

/* ---------- Helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s||'').replace(/[“”]/g,'"').trim().replace(/\s+/g,' ');
const list=s=>String(s||'').split(',').map(x=>clean(x).replace(/^["']|["']$/g,'')).filter(Boolean);
/* Smart split: spaces OR commas separate words; "quoted phrases" stay together */
function words(s){const out=[];const re=/"([^"]+)"|([^\s,"]+)/g;let m;const t=clean(s);while((m=re.exec(t))){const w=clean(m[1]||m[2]);if(w)out.push(w);}return out;}
const qt=s=>s.includes(' ')?`"${s}"`:s;
const digits=s=>String(s||'').replace(/[^0-9.]/g,'');
const enc=encodeURIComponent;
const google=q=>'https://www.google.com/search?q='+enc(q);
function orGroup(arr){return arr.length>1?`(${arr.join(' OR ')})`:arr[0];}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10);}
function chipVals(step,vals){return (vals||[]).map(v=>step.chips.find(c=>c.v===v)).filter(Boolean);}
const isEmpty=v=>v===undefined||v===null||(Array.isArray(v)?v.length===0:String(v).trim()==='');
const YEAR=String(new Date().getFullYear());
const PHRASE_TIP='Use quotes when words lose their meaning apart. Leave your main topic without quotes so Google can find close matches. Names work great in quotes, like "LeBron James."';
const SPLIT_TIP='Separate words with spaces or commas. Use quotes to keep words together, like "cold email."';
function phraseParts(s){return list(s).map(w=>w.includes(' ')?[`"${w}"`,'Quotes keep these words together, in this exact order.']:[w,'One word works on its own. Quotes are for two or more words.']);}
function minusParts(s,why){return words(s).map(w=>['-'+qt(w),why||'The minus sign removes results with this word.']);}
function aiWords(a){return ['ai0','ai1'].map(k=>a[k]).filter(Boolean);}
function aiParts(a){return aiWords(a).map(w=>[w,'From Mr. Paul’s quick question. Narrows it to what you need.']);}
const SAVE_TIP='After you add filters, bookmark the results page (Ctrl+D on Windows, Cmd+D on Mac). The link saves your search and filters, so you can run it again anytime with one click.';

/* ---------- Built-in suggestion lists ---------- */
const SUBS=[
 {k:['crm','saas','software','app','apps','tools'],s:['CRM','SaaS','smallbusiness','sales']},
 {k:['marketing','seo','ads','advertising','social media','email list'],s:['marketing','SEO','PPC','smallbusiness']},
 {k:['sales','prospect','lead'],s:['sales','smallbusiness']},
 {k:['business','startup','llc','entrepreneur','invoice','accounting'],s:['smallbusiness','Entrepreneur','startups']},
 {k:['iphone','ipad','mac','macbook','airpods'],s:['apple','gadgets','techsupport']},
 {k:['laptop','phone','computer','tv','headphones','camera','monitor','router','tech'],s:['gadgets','techsupport','BuyItForLife']},
 {k:['sourdough','bread','baking'],s:['Breadit','Baking','Cooking']},
 {k:['air fryer','kitchen','recipe','cooking','knife','pans','blender','meal'],s:['Cooking','BuyItForLife','Frugal','AskCulinary']},
 {k:['mattress','vacuum','furniture','home','house','roof','lawn','appliance'],s:['BuyItForLife','HomeImprovement','Frugal']},
 {k:['car','truck','suv','honda','toyota','ford','tesla','ev ','tire','cr-v'],s:['whatcarshouldIbuy','MechanicAdvice','cars']},
 {k:['budget','credit','invest','retire','mortgage','money','bank','loan','tax'],s:['personalfinance','Frugal','investing']},
 {k:['running','shoes','gym','workout','fitness','weight','yoga','bike'],s:['Fitness','running','BuyItForLife']},
 {k:['travel','flight','hotel','vacation','cruise','passport'],s:['travel','TravelHacks']},
 {k:['job','career','resume','interview','salary','hiring'],s:['careerguidance','jobs','resumes']},
 {k:['mba','college','degree','school','university','course'],s:['MBA','college','careerguidance']},
 {k:['baby','kids','parent','toddler'],s:['Parenting','BuyItForLife']},
 {k:['dog','puppy','cat ','cats','kitten','pet'],s:['dogs','cats','AskVet']}
];
const SITES=[
 {k:['iphone','ipad','mac','airpods','apple'],s:['apple.com','consumerreports.org','cnet.com']},
 {k:['review','laptop','phone','tv','headphones','camera','monitor','vacuum','mattress','appliance'],s:['consumerreports.org','cnet.com','rtings.com']},
 {k:['crm','saas','software','app'],s:['g2.com','capterra.com','hubspot.com']},
 {k:['small business','loan','startup','llc','grant','business plan','business'],s:['sba.gov','hbr.org','score.org']},
 {k:['flu','symptom','disease','vaccine','health','diet','vitamin','sleep','covid'],s:['mayoclinic.org','cdc.gov','nih.gov']},
 {k:['space','nasa','planet','mars','moon','rocket','eclipse'],s:['nasa.gov','scientificamerican.com']},
 {k:['tax','irs','retire','401k','invest','stock','money'],s:['irs.gov','investopedia.com']},
 {k:['passport','visa','travel'],s:['travel.state.gov','tripadvisor.com']},
 {k:['recipe','cooking','bread','baking'],s:['seriouseats.com','allrecipes.com']},
 {k:['mba','college','university','degree'],s:['usnews.com','ed.gov']},
 {k:['leadership','management','strategy'],s:['hbr.org','mckinsey.com']}

function suggest(table,topic,dflt){const t=' '+clean(topic).toLowerCase().replace(/[^a-z0-9\- ]/g,' ')+' ';const out=[];

  else if(S.ai.status==='done')extra=S.ai.qs.map((q,n)=>({k:'ai'+n,label:q.q,type:'single',ai:true,chips:[...q.options.map(o=>({v:o,l:o})),{v:'',l:'Skip'}]}));

}

  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),15000);
  try{const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal});
    if(!r.ok)throw new Error('bad');return await r.json();}
  finally{clearTimeout(t);}
}
function fetchFollowups(topic){
  const pid=S.pid;S.ai={status:'loading',topic,qs:[]};delete S.a.ai0;delete S.a.ai1;
  callAI({mode:'followup',platform:P[pid].name,topic}).then(d=>{
    if(S.pid!==pid||S.ai.topic!==topic||S.ai.status!=='loading')return;
    const qs=(d&&Array.isArray(d.questions)?d.questions:[]).filter(q=>q&&q.q&&Array.isArray(q.options)&&q.options.length>=2).slice(0,2)
      .map(q=>({q:String(q.q).slice(0,80),options:q.options.slice(0,6).map(o=>String(o).slice(0,40))}));
    S.ai={status:qs.length?'done':'none',topic,qs};renderModule();
  }).catch(()=>{if(S.pid===pid&&S.ai.topic===topic&&S.ai.status==='loading'){S.ai={status:'none',topic,qs:[]};renderModule();}});
}

/* ---------- Home ---------- */

  S=fresh();
  app.classList.add('home');
  app.style.minHeight=HOME_H?HOME_H+'px':'';
  app.innerHTML=`

/* ---------- Module ---------- */
function openModule(pid,example){
  S=fresh();S.view='module';S.pid=pid;
  if(example){S.a=JSON.parse(JSON.stringify(P[pid].examples[0].a));S.ai.status='off';S.cur=visible().length;}
  renderModule();postTop();
}
function renderModule(){
  app.classList.remove('home');app.style.minHeight='';
  const p=P[S.pid], vs=visible();
  let html=`
    <div class="topbar">
      <div class="mtitle"><small>Search Master</small>${p.ic} ${esc(p.title||p.name+': '+p.ps)}</div>
      <div class="ctrls"><button class="cbtn" id="restart">Start Over</button><button class="cbtn" id="close">Close</button></div>
    </div>
    <div class="tip">${mrPaul('happy')}<div>${p.tip}</div></div>`;
  if(S.cur===0&&isEmpty(S.a[vs[0].k]))html+=`<button class="exbtn" id="example">Show me an example: ${esc(p.examples[0].label)}</button>`;
  vs.forEach((st,i)=>{ if(i>S.cur)return; html+=stepHTML(st,i,i===S.cur&&!done()); });
  const q=query();
  html+=`<div class="live" id="live" ${firstAnswered()&&q?'':'style="display:none"'}><span>Your search so far</span><code id="liveq">${esc(q)}</code></div>`;
  html+=`<div id="result"></div>`;
  app.innerHTML=html;
  wireModule();
  if(done())renderResult();
  postHeight();
}
function chipsPreview(st){const w=words(S.a[st.k]);return w.length?`<div class="wchips"><span>We’ll read this as:</span>${w.map(x=>`<i>${esc(x)}</i>`).join('')}</div>`:'';}
function stepHTML(st,i,active){
  const v=S.a[st.k];let field='';const label=val(st,'label'),ex=val(st,'ex');
  if(st.type==='loading'){
    return `<div class="step thinking" data-i="${i}"><div class="sh"><span class="n">…</span>${esc(label)}</div>
      ${active?`<div class="sa"><button class="ghost" id="skipAI">Skip</button></div>`:''}</div>`;
  }
  if(st.type==='text'){
    field=`<input type="text" data-k="${st.k}" value="${esc(v||'')}" autocomplete="off" aria-label="${esc(label)}">`;
    if(st.split)field+=`<div class="hint">${SPLIT_TIP}</div><div class="wprev" data-prev="${st.k}">${chipsPreview(st)}</div>`;
    if(st.tip)field+=`<div class="hint">${esc(st.tip)}</div>`;
  } else if(st.type==='sub'||st.type==='site'){
    const isSub=st.type==='sub';
    const topic=S.a.topic;
    const sug=isSub?suggest(SUBS,topic,[]):suggest(SITES,topic,['wikipedia.org','consumerreports.org']);
    const cur=isSub?normSub(v).toLowerCase():normSite(v).d;
    const chips=(isSub?[{v:'',l:'All of Reddit'}]:[]).concat(sug.map(s=>({v:s,l:isSub?'r/'+s:s})));
    field=`<div class="sugl">${isSub?'Suggested communities':'Suggested websites'}</div>
      <div class="chips">${chips.map(c=>{const on=isSub?(cur===c.v.toLowerCase()):(cur&&cur===c.v);return `<button class="chip ${on?'on':''}" data-pick="${st.k}" data-v="${esc(c.v)}">${esc(c.l)}</button>`;}).join('')}</div>
      <div class="sugl" style="margin-top:12px">${isSub?'Or type your own':'Or type any website'}</div>
      <input type="text" data-k="${st.k}" value="${esc(v||'')}" autocomplete="off" aria-label="${esc(label)}">
      <div class="hint" data-fixnote="${st.k}">${isSub?'Not sure of the name? Pick a suggestion or leave it on All of Reddit.':fixNote(v)}</div>`;
  } else {
    const dv=st.def!==undefined?st.def:(st.req?undefined:'');
    field=`<div class="chips">${st.chips.map(c=>{const on=st.type==='multi'?(v||[]).includes(c.v):(v??dv)===c.v;return `<button class="chip ${on?'on':''}" data-k="${st.k}" data-v="${esc(c.v)}" data-t="${st.type}">${esc(c.l)}</button>`;}).join('')}</div>`;
  }
  return `<div class="step${st.ai?' aistep':''}" data-i="${i}">
    <div class="sh"><span class="n">${st.ai?'✦':i+1}</span>${esc(label)}</div>
    ${st.ai?'<div class="ex">Mr. Paul’s quick question. Pick one, or skip.</div>':ex?`<div class="ex">Example: <b>${esc(ex)}</b></div>`:'<div class="ex"></div>'}
    <div class="field">${field}</div>
    <div class="warn" id="warn${i}">Please answer this one to keep going.</div>
    ${active?`<div class="sa">${i>0?`<button class="ghost back" data-back="${i}">← Back</button>`:''}<button class="go" data-next="${i}">Next →</button>${st.req?'':`<button class="ghost" data-next="${i}">Skip</button>`}<button class="ghost donebtn" data-done="${i}" ${reqDone()&&i<visible().length-1?'':'style="display:none"'}>Done, show my search</button></div>`:''}
  </div>`;
}
function fixNote(v){const {d,fixed}=normSite(v);return fixed?`We used <b>${esc(d)}</b>. Change it if that’s not right.`:'Type it like <b>hbr.org</b>. No https:// needed.';}
function changed(){S.override=null;S.imp=null;}
function wireModule(){
  document.getElementById('restart').onclick=()=>{openModule(S.pid);};
  document.getElementById('close').onclick=()=>{renderHome();postTop();};
  const ex=document.getElementById('example'); if(ex)ex.onclick=()=>openModule(S.pid,true);
  const sk=document.getElementById('skipAI'); if(sk)sk.onclick=()=>{S.ai.status='none';renderModule();};
  app.querySelectorAll('input[type=text]').forEach(inp=>{
    inp.oninput=()=>{S.a[inp.dataset.k]=inp.value;changed();
      const st=P[S.pid].steps.find(s=>s.k===inp.dataset.k);
      const pv=app.querySelector(`[data-prev="${inp.dataset.k}"]`); if(pv&&st)pv.innerHTML=chipsPreview(st);
      const fn=app.querySelector(`[data-fixnote="site"]`); if(fn&&inp.dataset.k==='site')fn.innerHTML=fixNote(inp.value);
      if(st&&(st.type==='sub'||st.type==='site'))app.querySelectorAll(`[data-pick="${st.k}"]`).forEach(c=>{
        const cur=st.type==='sub'?normSub(inp.value).toLowerCase():normSite(inp.value).d;c.classList.toggle('on',st.type==='sub'?cur===c.dataset.v.toLowerCase():(cur&&cur===c.dataset.v));});
      refresh();};
    inp.onkeydown=e=>{if(e.key==='Enter'){const b=inp.closest('.step').querySelector('.go');if(b)b.click();else inp.blur();}};
  });
  app.querySelectorAll('[data-pick]').forEach(c=>c.onclick=()=>{S.a[c.dataset.pick]=c.dataset.v;changed();renderModule();});
  app.querySelectorAll('.chip[data-k]').forEach(c=>c.onclick=()=>{
    const k=c.dataset.k,v=c.dataset.v;
    if(c.dataset.t==='multi'){const arr=S.a[k]||[];S.a[k]=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];}
    else S.a[k]=v;
    changed();renderModule();
  });
  app.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{S.cur=Math.max(0,+b.dataset.back-1);renderModule();
    const st=app.querySelector(`.step[data-i="${S.cur}"]`);if(st)st.scrollIntoView({behavior:'smooth',block:'center'});});
  app.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{
    if(!reqDone())return;
    S.fin=true;renderModule();
    const r=document.getElementById('result');if(r)r.scrollIntoView({behavior:'smooth',block:'start'});
  });
  app.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.next, st=visible()[i], v=S.a[st.k];
    if(st.req&&isEmpty(v)&&b.classList.contains('go')){document.getElementById('warn'+i).style.display='block';postHeight();return;}
    if(b.classList.contains('ghost')&&st.type==='single'&&!st.req)S.a[st.k]='';
    const p=P[S.pid];
    if(st.k===p.aiAfter&&S.ai.status!=='off'){
      const topic=(S.pid==='linkedin'?(S.a.type||'')+': ':'')+clean(S.a[st.k]);
      if(topic&&topic!==S.ai.topic)fetchFollowups(topic);
    }
    S.cur=i+1;renderModule();
    const last=app.querySelector(`.step[data-i="${S.cur}"]`);
    const nextInput=last?last.querySelector('input'):null;
    if(nextInput)nextInput.focus({preventScroll:true});
  });
}
function refresh(){
  const q=query(),live=document.getElementById('live');
  document.getElementById('liveq').textContent=q;
  live.style.display=firstAnswered()&&q?'block':'none';
  const db=app.querySelector('.donebtn');
  if(db)db.style.display=reqDone()&&S.cur<visible().length-1?'':'none';
  if(done())renderResult();
}

/* ---------- Result ---------- */
function renderResult(){
  const p=P[S.pid],q=query(),lazy=clean(p.lazy(S.a));
  const parts=S.override?explain(S.override):p.build(S.a);
  const box=document.getElementById('result');
  if(!q){box.innerHTML='';return;}
  const extra=p.extra?p.extra(S.a,q):null;
  const notes=p.notes?p.notes(S.a):[];
  const anim=box.dataset.shown?' noanim':''; box.dataset.shown='1';
  const imp=S.imp;
  const same=!S.override&&clean(q).toLowerCase()===lazy.toLowerCase();
  const canMore=S.cur<visible().length-1||(S.fin&&S.cur<visible().length);
  box.innerHTML=`<div class="result${anim}">
    <div class="rh">Here’s your search</div>
    <div class="qbox q">${esc(q)}</div>
    <div class="row"><button class="go" id="copy">Copy</button><button class="ghost" id="run">Run This Search ↗</button>${p.tryAgain?`<button class="ghost" id="again">${p.tryAgain.l}</button>`:''}</div>
    ${p.loginNote?`<p class="note warnline">${p.loginNote}</p>`:''}
    <ul class="parts">${parts.map(x=>`<li><code>${esc(x[0])}</code><span>${esc(x[1])}</span></li>`).join('')}</ul>
    ${notes.map(n=>`<p class="tipline">💡 ${esc(n)}</p>`).join('')}
    <div class="better">
      ${S.override&&!imp?`<span class="note">✓ Improved by Mr. Paul.</span><button class="ghost" id="undoImp">Undo</button>`
        :!imp?`<button class="go gold2" id="improve">✨ Make my search better</button><span class="note">Mr. Paul reviews your search and suggests an upgrade.</span>`
        :imp.status==='loading'?`<div class="note">Mr. Paul is looking over your search…</div>`
        :imp.status==='fail'?`<div class="note">Mr. Paul couldn’t review it right now. Your search above is ready to use.</div>`
        :`<div class="impcard"><h4>Mr. Paul’s suggestion</h4><code>${esc(imp.query)}</code><ul>${(imp.why||[]).map(w=>`<li>${esc(w)}</li>`).join('')}</ul>
          ${imp.query&&imp.query!==q?`<div class="row" style="margin-bottom:0"><button class="go" id="useImp">Use this search</button><button class="ghost" id="keepMine">Keep mine</button></div>`:''}</div>`}
    </div>
    ${same?`<div class="nudge"><p><b>Your search is the same as what most people type.</b> Add a filter or two, or let Mr. Paul upgrade it.</p>
      <div class="row" style="margin:10px 0 0">${canMore?'<button class="go" id="nudgeMore">Add more filters</button>':''}${!S.override?'<button class="ghost" id="nudgeImp">✨ Make my search better</button>':''}</div></div>`:`<div class="ba">
      <div class="bacol b"><h4>Before: what most people type</h4><code>${esc(lazy)}</code><button class="mini" id="runLazy">Try it ↗</button></div>
      <div class="bacol a"><h4>After: the Search Master way</h4><code>${esc(q)}</code><button class="mini" id="runSmart">Try it ↗</button></div>
    </div>`}
    ${extra?`<div class="extra"><b>${esc(extra.t)}</b>${extra.d?`<p class="note" style="margin:4px 0 0">${esc(extra.d)}</p>`:''}<code>${esc(extra.q)}</code><button class="mini" style="color:var(--gold)" id="copyExtra">Copy</button> <button class="mini" style="color:var(--gold)" id="runExtra">Run on Google ↗</button></div>`:''}
    ${S.phase==='how'?'':`<div class="changes" id="changes">
      ${S.phase==='changes'
        ?`<p>Change any answer above. Your search updates as you type.</p><div class="row"><button class="go" id="noChg">I’m done, no more changes</button>${S.fin&&S.cur<visible().length?'<button class="ghost" id="more">Add more filters</button>':''}</div>`
        :`<p>Any changes?</p><div class="row"><button class="go" id="yes">Yes</button><button class="ghost" id="no">No, I’m good</button></div>`}
    </div>`}
    ${S.phase==='how'?`<div class="how"><h4>How to use your search on ${esc(p.name)}</h4><ol>${p.how(S.a).map(l=>`<li>${l}</li>`).join('')}</ol>
      <div class="row"><button class="go" id="copy2">Copy</button><button class="ghost" id="run2">Run This Search ↗</button><button class="ghost" id="other">Search another platform</button></div>
      <p class="note">On a computer, Run This Search opens a small window on top of this page. Close it to come right back here.</p>
      <p class="note">Once you know the pieces, you can type searches like this yourself, anywhere. Ads may still show at the top. The goal is the right results, first time.</p></div>`:''}
  </div>`;
  const url=p.url(q,S.a);
  const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn;};
  on('copy',()=>copy(q));on('copy2',()=>copy(q));
  on('run',()=>openUrl(url));on('run2',()=>openUrl(url));on('runSmart',()=>openUrl(url));
  on('runLazy',()=>openUrl(p.url(lazy,S.a)));
  if(extra){on('copyExtra',()=>copy(extra.q));on('runExtra',()=>openUrl(google(extra.q)));}
  on('again',()=>{S.fin=false;S.phase=null;changed();const k=p.tryAgain.k;S.cur=Math.max(0,visible().findIndex(s=>s.k===k));renderModule();
    const st=app.querySelector(`.step[data-i="${S.cur}"]`);if(st)st.scrollIntoView({behavior:'smooth',block:'center'});});
  on('improve',()=>{S.imp={status:'loading'};renderResult();const pid=S.pid,base=q;
    callAI({mode:'improve',platform:p.name,query:base}).then(d=>{if(S.pid!==pid||!S.imp)return;
      if(d&&d.query){S.imp={status:'done',query:String(d.query).slice(0,400),why:(Array.isArray(d.why)?d.why:[]).slice(0,3).map(w=>String(w).slice(0,200))};}else S.imp={status:'fail'};renderResult();})
    .catch(()=>{if(S.pid===pid&&S.imp){S.imp={status:'fail'};renderResult();}});});
  on('undoImp',()=>{S.override=null;renderResult();refreshLive();});
  on('nudgeImp',()=>{const b=document.getElementById('improve');if(b)b.click();});
  on('nudgeMore',()=>{S.fin=false;S.phase=null;S.cur=Math.min(S.cur+1,visible().length);renderModule();
    const st=app.querySelector(`.step[data-i="${S.cur}"]`);if(st)st.scrollIntoView({behavior:'smooth',block:'center'});});
  on('useImp',()=>{S.override=S.imp.query;S.imp=null;renderResult();refreshLive();});
  on('keepMine',()=>{S.imp=null;renderResult();});
  on('yes',()=>{S.phase='changes';renderResult();const f=app.querySelector('.step');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});});
  on('noChg',()=>{S.phase='how';renderResult();});
  on('more',()=>{S.fin=false;S.phase=null;S.cur=Math.min(S.cur+1,visible().length);renderModule();const st=app.querySelectorAll('.step');const l=st[st.length-1];if(l)l.scrollIntoView({behavior:'smooth',block:'center'});});
  on('no',()=>{S.phase='how';renderResult();});
  on('other',()=>{renderHome();postTop();});
  postHeight();
}
function explain(q){
  const re=/(?:AND|NOT)\s+\([^)]*\)|(?:AND|NOT)\s+"[^"]+"|(?:AND|NOT)\s+\S+|-?[a-z_]+:(?:"[^"]+"|\S+)|-?"[^"]+"|\([^)]*\)|\S+/gi;
  const out=[];let m;
  while((m=re.exec(q))){const t=m[0];let w;
    const low=t.toLowerCase();
    if(/^not\s/i.test(t))w=t.includes(' OR ')?'NOT removes anything with any of these words.':'NOT removes anything with this word.';
    else if(/^and\s/i.test(t))w=t.includes(' OR ')?'At least one of these must be there.':'AND means this must be there too.';
    else if(/^-?site:/.test(low))w=low.startsWith('-')?'Leaves out that website.':'Searches only that website.';
    else if(/^-inurl:/.test(low))w='Skips pages with that in the web address.';
    else if(/^intitle:/.test(low))w='Only pages with this in the title.';
    else if(/^filetype:/.test(low))w='Only that type of file.';
    else if(/^(after|since):/.test(low))w='Only results after this date.';
    else if(/^from:/.test(low))w='Only posts from that account.';
    else if(/^min_faves:/.test(low))w='Only posts with at least this many likes.';
    else if(/^filter:/.test(low))w='Only posts of that kind.';
    else if(t.startsWith('-'))w='The minus sign removes results with this.';
    else if(t.startsWith('('))w=t.includes(' OR ')?'OR means any of these will do. Parentheses keep them grouped.':'Grouped together.';
    else if(t.startsWith('"'))w='Quotes keep these words together, in this exact order.';
    else if(t==='OR')w='Either side will do.';
    else w='A search word.';
    out.push([t,w]);}
  return out;
}
function refreshLive(){const l=document.getElementById('liveq');if(l)l.textContent=query();}
function openUrl(u){
  const desktop=window.matchMedia('(min-width:768px) and (pointer:fine)').matches;
  if(desktop){
    const w=Math.min(1100,screen.availWidth-80), h=Math.min(800,screen.availHeight-80);
    const left=Math.round((window.screenX||0)+((window.outerWidth||screen.availWidth)-w)/2);
    const top=Math.round((window.screenY||0)+((window.outerHeight||screen.availHeight)-h)/2);
    const pop=window.open(u,'searchMasterResults',`popup=yes,width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes`);
    if(pop){try{pop.opener=null;}catch(e){} try{pop.focus();}catch(e){} return;}
  }
  window.open(u,'_blank','noopener');
}
function copy(t){
  const ok=()=>{const el=document.getElementById('toast');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1400);};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok).catch(()=>fallback(t,ok));}else fallback(t,ok);
}
function fallback(t,ok){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(e){}document.body.removeChild(ta);}

renderHome();
</script>
